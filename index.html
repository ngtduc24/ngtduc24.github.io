    <script>
      (function(){
        try {
          var c = JSON.parse(localStorage.getItem('brandThemeCache') || 'null');
          if (c && c.brand) {
            var s = document.documentElement.style;
            s.setProperty('--color-brand', c.brand);
            if (c.hover) s.setProperty('--color-brand-hover', c.hover);
            if (c.light) s.setProperty('--color-brand-light', c.light);
          }
        } catch(e){}
        try {
          var f = JSON.parse(localStorage.getItem('fontThemeCache') || 'null');
          if (f && (f.heading || f.body)) {
            var st = document.documentElement.style;
            if (f.heading) st.setProperty('--font-display', '"' + f.heading + '", "Space Grotesk", ui-sans-serif, system-ui, sans-serif');
            if (f.body) st.setProperty('--font-sans', '"' + f.body + '", "Inter", ui-sans-serif, system-ui, sans-serif');
            [f.headingUrl, f.bodyUrl].forEach(function(u){
              if (u && !document.querySelector('link[href="' + u + '"]')) {
                var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = u; document.head.appendChild(l);
              }
            });
          }
        } catch(e){}
      })();
    </script>
    <title>EduGo - Nền tảng học tập và làm việc trực tuyến</title>
