<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Đang mở...</title>
<script>
  // Link chia sẻ mới tạo (/bt/<mã>/, /bg/<mã>/...) chưa có trang tĩnh cho tới lần build kế tiếp,
  // chuyển thẳng vào trang tương ứng để người mở link vẫn xem được ngay.
  (function () {
    var map = { bt: '/?bt=', bg: '/?elview=', hl: '/?elesson=', tn: '/?quiz=', vr: '/?vr=', ar: '/?ar=', nb: '/tracuu.html?edu=',
                c: '/?portfolio=true&page=courses&course=', p: '/?portfolio=true&page=projects&project=', r: '/?portfolio=true&page=research&research=', b: '/?portfolio=true&post=' };
    var m = location.pathname.match(/^\/([a-z]{1,2})\/([A-Za-z0-9_-]{1,120})\/?$/);
    location.replace(m && map[m[1]] ? map[m[1]] + m[2] : '/');
  })();
</script>
</head>
<body style="font-family:system-ui,sans-serif;color:#475569;text-align:center;padding:48px">Đang mở trang, vui lòng chờ trong giây lát.</body>
</html>
